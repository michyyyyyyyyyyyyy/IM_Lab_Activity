<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Management · FINDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="logo" href="index.html">
          <span class="logo__mark"><i data-lucide="search"></i></span>
          <span class="logo__text">
            <strong>FINDIT</strong>
            <small>Holy Cross of Davao College</small>
          </span>
        </a>
        <nav class="sidebar-nav">
          <a href="admin.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
          <a class="is-active" href="admin-items.html"><i data-lucide="package"></i> Item management</a>
          <a href="admin-claims.html"><i data-lucide="clipboard-check"></i> Claims management</a>
        </nav>
        <div class="sidebar-user">
          <strong data-user-name>HCDC Admin</strong>
          <a href="#" data-logout>Sign out</a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-topbar">
          <button class="sidebar-toggle" aria-label="Open sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.1rem; margin: 0">Reported items</h1>
        </header>
        <div class="app-content">
          <div class="filters" style="grid-template-columns: 1.6fr 1fr 1fr">
            <input class="input" id="filter-q" type="search" placeholder="Search items" />
            <select class="select" id="filter-type">
              <option value="all">All types</option>
              <option value="lost">Lost</option>
              <option value="found">Found</option>
            </select>
            <select class="select" id="filter-category" data-category-select>
              <option value="all">All categories</option>
            </select>
          </div>
          <section class="card table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Date reported</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-items-body"></tbody>
            </table>
          </section>
        </div>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__dialog">
        <h2>Delete this item report?</h2>
        <p>This confirmation is frontend-only. No database record will be removed.</p>
        <div class="hero__actions">
          <button class="btn btn-danger" id="confirm-delete">Delete</button>
          <button class="btn btn-secondary" data-close-modal>Cancel</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/browse.js"></script>
  </body>
</html>
