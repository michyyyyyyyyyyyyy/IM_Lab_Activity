<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · FINDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell" id="admin-dashboard">
      <aside class="sidebar">
        <a class="logo" href="index.html">
          <span class="logo__mark"><i data-lucide="search"></i></span>
          <span class="logo__text">
            <strong>FINDIT</strong>
            <small>Holy Cross of Davao College</small>
          </span>
        </a>
        <nav class="sidebar-nav">
          <a class="is-active" href="admin.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
          <a href="admin-items.html"><i data-lucide="package"></i> Item management</a>
          <a href="admin-claims.html"><i data-lucide="clipboard-check"></i> Claims management</a>
          <a href="browse.html"><i data-lucide="globe"></i> Public catalog</a>
        </nav>
        <div class="sidebar-user">
          <strong data-user-name>HCDC Admin</strong>
          <div>Campus Security / Student Affairs</div>
          <a href="#" data-logout>Sign out</a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-topbar">
          <button class="sidebar-toggle" aria-label="Open sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.1rem; margin: 0">HCDC administration</h1>
        </header>
        <div class="app-content">
          <div class="stat-grid">
            <article class="card stat-card"><span>Total reported items</span><strong id="admin-total">0</strong></article>
            <article class="card stat-card"><span>Lost items</span><strong id="admin-lost">0</strong></article>
            <article class="card stat-card"><span>Found items</span><strong id="admin-found">0</strong></article>
            <article class="card stat-card"><span>Pending claims</span><strong id="admin-pending">0</strong></article>
          </div>
          <div class="hero__actions" style="margin-bottom: 18px">
            <a class="btn btn-primary" href="admin-items.html">Manage items</a>
            <a class="btn btn-secondary" href="admin-claims.html">Review claims</a>
          </div>
          <div class="two-col">
            <section class="card panel">
              <div class="panel__head"><h2>Recent reports</h2></div>
              <div id="admin-recent-reports"></div>
            </section>
            <section class="card panel">
              <div class="panel__head"><h2>Recent activities</h2></div>
              <div id="admin-activity"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
