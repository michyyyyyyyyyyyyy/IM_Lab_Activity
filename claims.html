<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Claims · FINDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="logo" href="index.html">
          <span class="logo__mark"><i data-lucide="search"></i></span>
          <span class="logo__text">
            <strong>FINDIT</strong>
            <small>Holy Cross of Davao College</small>
          </span>
        </a>
        <nav class="sidebar-nav">
          <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Overview</a>
          <a href="browse.html"><i data-lucide="search"></i> Browse items</a>
          <a href="report.html"><i data-lucide="plus-circle"></i> Report an item</a>
          <a href="my-reports.html"><i data-lucide="folder"></i> My reports</a>
          <a class="is-active" href="claims.html"><i data-lucide="clipboard-list"></i> My claims</a>
        </nav>
        <div class="sidebar-user">
          <strong data-user-name>Alex Rivera</strong>
          <div data-user-email>alex.rivera@hcdc.edu.ph</div>
          <a href="#" data-logout>Sign out</a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-topbar">
          <button class="sidebar-toggle" aria-label="Open sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.1rem; margin: 0">Claim requests</h1>
        </header>
        <div class="app-content" id="claims-list"></div>
      </div>
    </div>

    <div class="modal" id="claim-detail-modal">
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__dialog">
        <h2>Claim details</h2>
        <div id="claim-detail-body"></div>
        <button class="btn btn-secondary" data-close-modal>Close</button>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/browse.js"></script>
  </body>
</html>
