<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reports · FINDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/components.css?v=20261121" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="logo" href="index.html">
          <span class="logo__mark"><i data-lucide="search"></i></span>
          <span class="logo__text">
            <strong>FINDIT</strong>
            <small>Holy Cross of Davao College</small>
          </span>
        </a>
        <nav class="sidebar-nav">
          <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Overview</a>
          <a href="browse.html"><i data-lucide="search"></i> Browse items</a>
          <a href="report.html"><i data-lucide="plus-circle"></i> Report an item</a>
          <a class="is-active" href="my-reports.html"><i data-lucide="folder"></i> My reports</a>
          <a href="claims.html"><i data-lucide="clipboard-list"></i> My claims</a>
        </nav>
        <div class="sidebar-user">
          <strong data-user-name>Alex Rivera</strong>
          <div data-user-email>alex.rivera@hcdc.edu.ph</div>
          <a href="#" data-logout>Sign out</a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-topbar">
          <button class="sidebar-toggle" aria-label="Open sidebar"><i data-lucide="menu"></i></button>
          <h1 style="font-size: 1.1rem; margin: 0">My reports</h1>
          <a class="btn btn-primary btn-sm" href="report.html">New report</a>
        </header>
        <div class="app-content">
          <div class="tabs" style="margin-bottom: 16px">
            <button class="tab is-active" data-report-tab="lost">Lost reports</button>
            <button class="tab" data-report-tab="found">Found reports</button>
          </div>
          <section class="card panel" id="my-reports-list"></section>
        </div>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__dialog">
        <h2>Delete this report?</h2>
        <p>This will archive the report in the database. Related claim history is kept.</p>
        <div class="hero__actions">
          <button class="btn btn-danger" id="confirm-delete">Delete</button>
          <button class="btn btn-secondary" data-close-modal>Cancel</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js?v=20261121"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/browse.js?v=20261121"></script>
  </body>
</html>
