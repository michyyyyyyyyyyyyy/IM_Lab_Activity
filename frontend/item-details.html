<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Details · FINDIT · HCDC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/components.css?v=20261121" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="brand-stripe" aria-hidden="true"></div>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="index.html">
          <span class="logo__mark"><i data-lucide="search"></i></span>
          <span class="logo__text">
            <strong>FINDIT</strong>
            <small>Holy Cross of Davao College</small>
          </span>
        </a>
        <button class="nav-toggle" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="browse.html">Browse Items</a>
          <a href="report.html">Report an Item</a>
          <a href="index.html#about">About Us</a>
          <a class="btn btn-primary btn-sm" href="login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="container page-hero">
      <div class="details-layout" id="item-details"></div>
    </main>

    <div class="modal" id="claim-modal">
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__dialog">
        <h2>Submit a claim</h2>
        <p>Describe unique features only the owner would know. HCDC staff will review before releasing the item at the Security Desk.</p>
        <form id="claim-form">
          <div class="form-group">
            <label class="label" for="note">Ownership details</label>
            <textarea class="textarea" id="note" name="note" required></textarea>
          </div>
          <div class="hero__actions">
            <button class="btn btn-primary" type="submit">Submit claim</button>
            <button class="btn btn-secondary" type="button" data-close-modal>Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js?v=20261121"></script>
    <script src="assets/js/browse.js?v=20261121"></script>
  </body>
</html>
